meta:
  contract: VaultAssetAG
  date: '2026-06-26'
  task: 0003 assurance package (T2)
  composition: assume-guarantee (A∘B, single external call, non-reentrant frame)
  note: 'Cross-contract solvency holds for the vault composed with an honest ERC20.
    The mined weakest-sufficient guarantee is `at_least`; candidates `monotone`, `upper_only`,
    `irrelevant` were solver-refuted as insufficient (see measurement/artifacts/cross_ag__triage.json).
    The guarantee is not assumed on faith — it is discharged by C2.

    '
claims:
- id: C1
  human: 'The vault stays solvent — balanceOf(vault) >= totalAssets — when composed
    with an ERC20 that honours the callee guarantee.

    '
  formal: vaultBal >= totalAssets
  shape: quantified-over-mapping
  verdict: proven
  engine: solc 0.8.35 chc z3
  evidence:
    smt_query: evidence/smt/C1__VaultAssetAG__cross.sol
    reproduce: solc --model-checker-engine chc --model-checker-targets assert --model-checker-solvers
      z3 --model-checker-timeout 20000 <harness>
  depends_on:
  - kind: claim
    ref: C2
    status: proven
    human: the ERC20 callee actually delivers the guarantee the caller assumed (B
      ⊨ G_B)
  - kind: lean_theorem
    ref: L_cons
    status: proven
    human: 'the tracked-sum ghost is faithful: a transfer preserves Σ balance (Lean
      kernel)'
  - kind: assumption
    ref: A_ag_rule
    status: assumed
    human: assume-guarantee composition is sound for this single-call, non-reentrant
      frame
  - kind: assumption
    ref: A_solver
    status: assumed
    human: the SMT proof of C1 is trusted (z3/SMTChecker), not re-checked by the Lean
      kernel
  - kind: harness_faithfulness
    ref: H_model
    status: assumed
    human: the cross harness models the deployed bytecode (unverified — the moat)
- id: C2
  human: 'The ERC20 callee guarantee G_B: every transfer credits the recipient by
    at least `amount` (callee-side form of the mined `vaultBal_post >= vaultBal +
    assets`).

    '
  formal: vaultBal_post >= vaultBal + assets
  shape: temporal-2state
  verdict: proven
  engine: solc 0.8.35 chc+bmc z3
  evidence:
    smt_query: evidence/smt/C2__MiniERC20Delta.sol
    reproduce: solc --model-checker-engine all --model-checker-targets assert --model-checker-solvers
      z3 --model-checker-timeout 20000 <harness>
  depends_on:
  - kind: lean_theorem
    ref: L_cons
    status: proven
    human: Σ-conservation underpins the per-transfer delta the guarantee asserts
  - kind: assumption
    ref: A_solver
    status: assumed
    human: the SMT proof of C2 (chc+bmc) is trusted, not re-checked by the Lean kernel
- id: C3
  human: 'Honest negative: the naive over-claim that the BUGGY vault never mints a
    share from nothing is REFUTED — deposit(0) mints one share against zero assets.

    '
  formal: totalShares == totalAssets
  shape: stateless
  verdict: refuted
  engine: solc 0.8.35 chc z3
  evidence:
    witness:
      assignments:
        totalAssets: '0'
        totalShares: '1'
      transaction_trace:
      - __Harness.constructor()
      - 'State: totalAssets = 0, totalShares = 0'
      - MiniVaultBuggy.deposit(0)
      - 'State: totalAssets = 0, totalShares = 1'
      - __Harness.__check_invariant()
      - 31 |         assert(totalShares == totalAssets);
    smt_query: evidence/smt/C3__MiniVaultBuggy__harness.sol
    reproduce: solc --model-checker-engine chc --model-checker-targets assert --model-checker-solvers
      z3 --model-checker-timeout 20000 <harness>
  depends_on: []
