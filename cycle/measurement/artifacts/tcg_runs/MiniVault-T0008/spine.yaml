meta:
  contract: MiniVault
  method: deposit
  date: '2026-06-29'
  task: tcg assurance package (T2)
  phi_hash: 518d5504343d6cada615eb73471a54a7245917d25418045993e269cf3d402c90
  assurance_level: ⊥_assumptions_open
  claim_scope: φ_checked=['pre', 'post'] (open assumptions named; NOT a verified claim)
  note: Source-level run. A proven Post over an OPEN dischargeable leaf (H_bytecode
    / phi_context) is NOT green — see render-rule.
claims:
- id: C1
  shape: stateless
  evidence_record: R_post
  human: every share is backed by an asset unit; no value minted from air
  depends_on:
  - kind: assumption
    ref: A_solver
    status: assumed
    human: the SMT proof is trusted (z3/SMTChecker), not re-checked by a Lean kernel
  - kind: assumption
    ref: A_machine_semantics
    status: assumed
    human: SMTChecker's EVM model is faithful to the real EVM (source-level)
  - kind: assumption
    ref: A_human_intent
    status: assumed
    human: H attests φ captures the intended economic property
  - kind: assumption
    ref: phi_context
    status: assumed
    human: deferred φ dimensions are not discharged — claim covers only φ_checked
  - kind: harness_faithfulness
    ref: H_bytecode
    status: assumed
    human: the verified source equals the deployed bytecode (UNVERIFIED — Inv.7)
ledger:
  lean_theorems: []
  assumptions:
  - id: A_solver
    leaf_class: irreducible
    status: assumed
    statement_human: The SMT solver's verdicts (z3 via SMTChecker) are sound.
    statement_formal: trust(solc 0.8.35+commit.47b9dedd.Darwin.appleclang chc z3(bundled)
      targets=['assert']) — no independent kernel re-check of the SMT proof
    why_assumed: ADR Assumption 3. The CHC/BMC proof is taken on the solver's word;
      lean-smt kernel reconstruction would replace this leaf (separate track). Visible,
      not hidden.
    risk_if_false: A solver soundness bug would make a 'proven' claim false. Mitigated
      by determinism and witness-bearing refutations, not eliminated.
  - id: A_machine_semantics
    leaf_class: irreducible
    status: assumed
    statement_human: SMTChecker's model of the EVM is faithful to the real EVM.
    statement_formal: model(SMTChecker EVM) ≈ real EVM / KEVM bytecode semantics
    why_assumed: ADR Assumption 1. The source-level proof reasons over SMTChecker's
      EVM abstraction; a full bytecode-semantics discharge (KEVM/Halmos) is a separate
      verify-level.
    risk_if_false: A semantic gap between the modelled and the executed EVM could
      let a 'proven' source property fail on-chain.
  - id: A_human_intent
    leaf_class: irreducible
    status: assumed
    statement_human: H attests that φ captures the intended economic property.
    statement_formal: φ ≈ intent (frozen by H; the single non-formal trust leaf)
    why_assumed: ADR Assumption 7. The translation from human economic intent to the
      formal φ is validated by a human, not a machine.
    risk_if_false: If φ misstates the intent, a correct proof discharges the wrong
      property.
  - id: phi_context
    leaf_class: dischargeable
    status: assumed
    statement_human: The deferred φ dimensions are NOT mechanically discharged.
    statement_formal: φ_context = ['trace-deep', 'exit-safety', 'exit-outofgas'] (declared
      in φ, not checked by K)
    why_assumed: ADR §2.2. Trace-deep, exit-safety and exit-outofgas are represented
      in φ but not discharged at source level (havoc wall / runner limits).
    risk_if_false: A property in φ_context could fail though the checked subset holds
      — the verified claim covers only φ_checked.
    discharge_path: 'full-tuple φ coverage: deep-Trace via KEVM/Halmos, exit-safety
      via a safety-verdict parser (backlog).'
  harness_faithfulness:
  - id: H_bytecode
    leaf_class: dischargeable
    target: source ↔ deployed runtime bytecode
    claim: the verified source compiles to the deployed runtime bytecode, bit-identical
    evidence: not measured at source level (runtime-hash + pinned settings + immutables/constructor/metadata
      accounting is the intended evidence — Sourcify-style)
    evidence_ref: n/a
    status: unverified
    discharge_path: runtime bytecode hash + pinned compiler settings (Inv.7).
