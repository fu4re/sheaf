record_id: R_lean_rayMul_bounds
kind: lean_theorem
produced_by:
  component: lean
  project: cycle/trusted/proofs/aave_arith
subject:
  human: rayMul(x,index)=floor(x*index/RAY) is bounded below by x when index>=RAY
    and above by 2x when index<=2*RAY — exactly the fixed-point bounds Aave's Certora
    specs postulate.
  formal: RAY ≤ index → x ≤ rayMul x index;  index ≤ 2*RAY → rayMul x index ≤ 2*x
result:
  verdict: proven
  engine: Lean 4 + Mathlib
